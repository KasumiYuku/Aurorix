<!doctype html>
<html lang="zh-CN" data-theme="theme-polaris">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1917">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6f1">
  <title>Aurorix</title>
  <script>
    //主题偏好 auto/light/dark 存 localStorage; DOM 恒 data-theme="theme-polaris",
    //深色由 .dark class 表达 (preline 主题机制)
    (function () {
      var pref = localStorage.getItem('px-theme') || 'auto'
      var el = document.documentElement
      el.dataset.theme = 'theme-polaris'
      var mql = matchMedia('(prefers-color-scheme: dark)')
      function apply() {
        var dark = pref === 'dark' || (pref === 'auto' && mql.matches)
        el.classList.toggle('dark', dark)
      }
      apply()
      if (pref === 'auto') mql.addEventListener('change', apply)
    })()
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23047857'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' text-anchor='middle' fill='%23faf6f1'%3EP%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
